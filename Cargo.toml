[package]
name = "tree-sitter-astro"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Astro grammar with structured TypeScript for Tree-sitter"
build = "bindings/rust/build.rs"
include = [
  "bindings/**", "src/**", "queries/**", "test/fixtures/**", "test/corpus/**",
  "grammar.js", "tree-sitter.json", "README.md", "LICENSE*", "docs/**",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27"
